apiVersion: apps/v1
kind: Deployment
metadata:
  name: onges-users-api
  namespace: onges-users
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onges-users-api
  template:
    metadata:
      labels:
        app: onges-users-api
    spec:
      containers:
        - name: api
          image: alexandresorza/onges-users-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: onges-users-api
  namespace: onges-users
spec:
  type: LoadBalancer
  selector:
    app: onges-users-api
  ports:
    - port: 80
      targetPort: 8080
